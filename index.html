<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>減肥大賽計分器</title>
<meta name="description" content="雙軌權重制（體重 40%＋體脂 60%）減肥大賽計分器">
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #1d1b18; --mute: #6b665d; --line: #e3ddd2; --accent: #c2410c; --ok: #15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --card: #1e2128; --ink: #ece8df; --mute: #9d978c; --line: #2d313b; --accent: #fb923c; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--mute); margin: 0 0 22px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .grid h2 { grid-column: 1 / -1; margin: 0; font-size: 15px; color: var(--mute); font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--mute); }
  input { width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; font-size: 18px; color: var(--ink);
          background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { width: 100%; margin-top: 16px; padding: 12px; font: inherit; font-weight: 700; color: #fff;
           background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  .err { color: #dc2626; font-size: 14px; margin-top: 10px; min-height: 1em; }
  #out[hidden] { display: none; }
  .total { text-align: center; padding: 6px 0 2px; }
  .total .n { font-size: 52px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .total .l { color: var(--mute); font-size: 14px; }
  h3 { margin: 0 0 8px; font-size: 16px; }
  ul { margin: 0; padding-left: 20px; }
  .quote { font-size: 17px; border-left: 4px solid var(--ok); padding-left: 12px; margin: 0; }
  .rule { font-size: 13px; color: var(--mute); }
  .rule code { font-size: 12px; }
  .copy { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 12px; font-weight: 600; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>減肥大賽計分器</h1>
  <p class="sub">雙軌權重制：體重降幅 40%＋體脂降幅 60%，結果四捨五入到小數點後兩位。</p>

  <form class="card" id="f" novalidate>
    <div class="grid">
      <h2>初始數據</h2>
      <label>體重（kg）<input id="w0" inputmode="decimal" placeholder="例：80.0" required></label>
      <label>體脂率（%）<input id="f0" inputmode="decimal" placeholder="例：30.0" required></label>
      <h2>結算數據</h2>
      <label>體重（kg）<input id="w1" inputmode="decimal" placeholder="例：75.0" required></label>
      <label>體脂率（%）<input id="f1" inputmode="decimal" placeholder="例：27.0" required></label>
    </div>
    <button type="submit">計算成績</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <section id="out" hidden aria-live="polite">
    <div class="card total"><div class="l">本次比賽最終總得分</div><div class="n" id="total"></div><div class="l">分</div></div>
    <div class="card">
      <h3>1. 減重數據摘要</h3>
      <ul><li id="s1"></li><li id="s2"></li></ul>
    </div>
    <div class="card">
      <h3>2. 得分試算</h3>
      <ul><li id="s3"></li><li id="s4"></li></ul>
    </div>
    <div class="card">
      <h3>3. 裁判評語</h3>
      <p class="quote" id="comment"></p>
      <button type="button" class="copy" id="copy">複製成績單</button>
    </div>
  </section>

  <p class="rule">計分規則：體重得分＝（初始體重－結算體重）÷ 初始體重 × 100 × 0.4；
    體脂得分＝（初始體脂率－結算體脂率）÷ 初始體脂率 × 100 × 0.6；總得分＝兩者相加。
    總分以未四捨五入的兩項得分相加後再四捨五入。數值只在你的瀏覽器裡計算，不會上傳。</p>
</main>
<script src="score.js"></script>
<script>
const $ = id => document.getElementById(id);
let report = '';
$('f').addEventListener('submit', e => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    const r = WeightLossScore.score(+$('w0').value, +$('f0').value, +$('w1').value, +$('f1').value,
      [$('w0'), $('f0'), $('w1'), $('f1')].map(i => i.value.trim()));
    const f = WeightLossScore.fmt;
    $('s1').textContent = `體重共減少：${f(r.weightLost)} kg（降幅：${f(r.weightPct)}%）`;
    $('s2').textContent = `體脂共減少：${f(r.fatLost)} 個百分點（降幅：${f(r.fatPct)}%）`;
    $('s3').textContent = `體重得分（佔 40%）：${f(r.weightScore)} 分`;
    $('s4').textContent = `體脂得分（佔 60%）：${f(r.fatScore)} 分`;
    $('total').textContent = f(r.total);
    $('comment').textContent = r.comment;
    report = WeightLossScore.report(r);
    $('out').hidden = false;
  } catch (er) { $('err').textContent = er.message; $('out').hidden = true; }
});
$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(report).then(() => { $('copy').textContent = '已複製'; setTimeout(() => $('copy').textContent = '複製成績單', 1200); });
});
</script>
</body>
</html>
